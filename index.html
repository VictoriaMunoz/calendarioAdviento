<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #edf4ef;
  font-family: 'Lato', sans-serif;
  overflow-x: hidden;
  position: relative;
  padding-bottom: 4rem;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 10%, rgba(159,225,203,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 80%, rgba(197,184,232,0.12) 0%, transparent 55%),
    radial-gradient(ellipse 50% 60% at 60% 40%, rgba(214,237,217,0.15) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.particle {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-size: var(--fs, 1.2rem);
  animation: flyUp var(--dur, 1.2s) ease-out forwards;
  user-select: none;
}
@keyframes flyUp {
  0%   { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
  60%  { opacity: 1; }
  100% { transform: translate(var(--tx, 0px), var(--ty, -120px)) rotate(var(--rot, 180deg)) scale(0.4); opacity: 0; }
}

.deco-leaf {
  position: fixed;
  font-size: var(--s, 2rem);
  opacity: var(--o, 0.12);
  pointer-events: none;
  z-index: 0;
  animation: sway var(--d, 8s) ease-in-out infinite alternate;
  transform-origin: bottom center;
}
@keyframes sway {
  0%   { transform: rotate(var(--r1, -6deg)); }
  100% { transform: rotate(var(--r2, 6deg)); }
}

.hero {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 3.5rem 2rem 1.5rem;
}

.hero-eyebrow {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #1D9E75;
  font-weight: 700;
  margin-bottom: 1rem;
  border: 1.5px solid #9FE1CB;
  padding: 0.35rem 1.2rem;
  border-radius: 999px;
  background: rgba(159,225,203,0.15);
}

.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 6vw, 3.4rem);
  color: #085041;
  font-weight: 400;
  line-height: 1.2;
  margin-bottom: 0.4rem;
}
.hero-title em {
  font-style: italic;
  color: #1D9E75;
}

.hero-sub {
  font-size: 13px;
  color: #5DCAA5;
  font-weight: 400;
  letter-spacing: 0.06em;
  margin-top: 0.5rem;
}

.hero-orquidea {
  display: block;
  margin: 1.2rem auto 0;
  width: 72px;
  height: 72px;
}

.hero-divider {
  margin: 1.5rem auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  max-width: 280px;
  color: #9FE1CB;
  font-size: 16px;
  letter-spacing: 6px;
}
.hero-divider::before,
.hero-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, #9FE1CB);
}
.hero-divider::after {
  background: linear-gradient(to left, transparent, #9FE1CB);
}

.grid-wrap {
  max-width: 920px;
  margin: 2rem auto 0;
  padding: 0 1.5rem 3rem;
  position: relative;
  z-index: 2;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
  gap: 14px;
}

.box {
  aspect-ratio: 1;
  border-radius: 22px;
  border: 2px solid #b8ddd0;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  text-decoration: none;
  position: relative;
  overflow: hidden;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  box-shadow: 0 3px 14px rgba(29,158,117,0.12);
}

.box::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6), transparent 65%);
  pointer-events: none;
}

.box:nth-child(4n)   { background: #e2f5eb; border-color: #8ed4b4; }
.box:nth-child(4n+1) { background: #f3e6f8; border-color: #d4a8e0; }
.box:nth-child(4n+2) { background: #eae7ff; border-color: #b8aee8; }
.box:nth-child(4n+3) { background: #fff3d6; border-color: #e8c878; }

.box:not(.locked):hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow: 0 16px 36px rgba(29,158,117,0.15), 0 0 0 1.5px #5DCAA5;
  border-color: #5DCAA5;
  z-index: 3;
}

.box-day {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem;
  font-weight: 400;
  color: #5DCAA5;
  line-height: 1;
  position: relative;
  z-index: 1;
  transition: color 0.2s;
}
.box:not(.locked):hover .box-day,
.box.open .box-day { color: #085041; }

.box-emoji {
  font-size: 1.4rem;
  position: relative;
  z-index: 1;
  transition: transform 0.3s ease;
}
.box:not(.locked):hover .box-emoji { transform: scale(1.3) rotate(-8deg); }

.box-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #9FE1CB;
  position: relative;
  z-index: 1;
  transition: color 0.2s;
}
.box:not(.locked):hover .box-label { color: #1D9E75; }

.box.locked {
  cursor: default;
  opacity: 0.65;
  background: #eef5f1;
  border-color: #bcd8cc;
}
.box.locked .box-day { color: #9FE1CB; }
.box.locked:hover { transform: none; box-shadow: none; }
.lock-icon { font-size: 1rem; position: relative; z-index: 1; opacity: 0.5; }

.box.today {
  background: linear-gradient(135deg, #e8f8f2, #f5eeff);
  border-color: #1D9E75;
  box-shadow: 0 0 0 1.5px #1D9E75, 0 8px 30px rgba(29,158,117,0.18);
  animation: glowToday 3s ease-in-out infinite alternate;
}
@keyframes glowToday {
  0%   { box-shadow: 0 0 0 1.5px #1D9E75, 0 8px 24px rgba(29,158,117,0.15); }
  100% { box-shadow: 0 0 0 1.5px #5DCAA5, 0 8px 36px rgba(29,158,117,0.28); }
}
.box.today .box-day { color: #1D9E75; }

.today-badge {
  position: absolute;
  top: 0; right: 0;
  background: #1D9E75;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 0 20px 0 12px;
  z-index: 2;
}

.box.meta {
  background: linear-gradient(135deg, #ffe3ea, #fff0d6);
  border-color: #ff8fab;
  box-shadow: 0 0 0 1.5px #ff8fab, 0 8px 30px rgba(255,143,171,0.28);
  animation: glowMeta 2.4s ease-in-out infinite alternate;
}
@keyframes glowMeta {
  0%   { box-shadow: 0 0 0 1.5px #ff8fab, 0 8px 24px rgba(255,143,171,0.22); }
  100% { box-shadow: 0 0 0 1.5px #ff5c8a, 0 8px 40px rgba(255,92,138,0.38); }
}
.box.meta .box-day  { color: #ff5c8a; }
.box.meta .box-label { color: #ff5c8a; }
.box.meta:hover .box-day,
.box.meta:hover .box-label { color: #e8447a; }
.box.meta .box-emoji { animation: heartbeat 1.6s ease-in-out infinite; }
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.25); }
}
.meta-badge {
  position: absolute;
  top: 0; right: 0;
  background: #ff5c8a;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 0 20px 0 12px;
  z-index: 2;
}

/* ============================================================
   CAJITA ESPECIAL — DÍA 26: AMOR Y AMISTAD
   Se abre el 19 de septiembre a las 12:00 m. (hora Colombia).
   Se diferencia con su propia franja tricolor amarillo/azul/rojo.
   ============================================================ */
.box.dia26 {
  background: linear-gradient(135deg, #fdf3d9, #eaf1fb);

}
.box.dia26 .box-day   { color: #c6362f; }
.box.dia26 .box-label { color: #1b4f9c; }
.box.dia26:hover .box-day,
.box.dia26:hover .box-label { color: #c6362f; }
.dia26-badge {

  text-transform: uppercase;

}

/* ============================================================

   Se abre el 21 de septiembre (medianoche, hora Colombia).
   ============================================================ */
.box.dia27 {
  background: linear-gradient(135deg, #fff6e0, #ffe9b3);

}
.box.dia27 .box-day   { color: #c9862a; }
.box.dia27 .box-label { color: #a86f22; }
.box.dia27:hover .box-day,
.box.dia27:hover .box-label { color: #c9862a; }
.box.dia27 .box-emoji { animation: sway27 2.4s ease-in-out infinite; }
@keyframes sway27 {
  0%, 100% { transform: rotate(-8deg); }

}
.dia27-badge {
  position: absolute;
  top: 0; right: 0;
  background: #e8a93a;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 0 20px 0 12px;
  z-index: 2;
}

.note {
  text-align: center;
  margin-top: 1.5rem;
  position: relative;
  z-index: 2;
}
.note p { font-size: 12px; color: #9FE1CB; font-weight: 400; letter-spacing: 0.04em; }

.footer {
  text-align: center;
  padding: 0 0 3rem;
  position: relative;
  z-index: 2;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 13px;
  color: #9FE1CB;
}

.modal-bg {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(8,80,65,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  backdrop-filter: blur(6px);
}
.modal-bg.show { opacity: 1; pointer-events: all; }

.modal {
  background: #ffffff;
  border: 1.5px solid #9FE1CB;
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(29,158,117,0.15);
  padding: 2.5rem 2rem;
  text-align: center;
  max-width: 320px;
  width: 90%;
  transform: scale(0.88) translateY(12px);
  transition: transform 0.3s ease;
}
.modal-bg.show .modal { transform: scale(1) translateY(0); }

.modal-flower { display: block; margin: 0 auto 1rem; width: 54px; height: 54px; }

.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  color: #085041;
  font-weight: 400;
  margin-bottom: 0.6rem;
}

.modal-msg {
  font-size: 14px;
  color: #5DCAA5;
  line-height: 1.75;
  margin-bottom: 1rem;
  font-weight: 300;
  font-family: 'Playfair Display', serif;
  font-style: italic;
}

.modal-date {
  font-size: 11px;
  color: #9FE1CB;
  letter-spacing: 0.08em;
  margin-bottom: 1.5rem;
  font-family: 'Lato', sans-serif;
}

.modal-btn {
  background: #1D9E75;
  color: #fff;
  border: 1.5px solid #1D9E75;
  font-family: 'Lato', sans-serif;
  font-size: 14px;
  font-weight: 400;
  padding: 0.65rem 2rem;
  border-radius: 999px;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.2s;
}
.modal-btn:hover { background: transparent; color: #1D9E75; }


</style>
</head>

  { title: "Paciencia",                      msg: "Esto lo hice con todo el amor del mundo." },
  { title: "Todavía no se desbloquea",       msg: "Pero me gusta que lo hayas intentado." },
  { title: "Casi casi",                      msg: "Pero todavía no." },
  { title: "Tres días",                      msg: "Solo tres. Aguanta." },
  { title: "Dos días más, preciosa",         msg: "Ya casi." },
  { title: "Mañana",                         msg: "Solo falta mañana." },
  { title: "Este es el último",              msg: "Ábrelo con calma." },
];

const today      = new Date();
const localToday = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();

function getBoxTime(day) {
  return new Date(START_YEAR, START_MONTH, START_DAY + day - 1).getTime();
}

function isUnlocked(day) {
  if (TEST_MODE) return true;
  return getBoxTime(day) <= localToday;
}

function isToday(day) {
  if (TEST_MODE) return day === 1;
  return getBoxTime(day) === localToday;
}

function boxDateLabel(day) {
  const d = new Date(START_YEAR, START_MONTH, START_DAY + day - 1);
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'long' });
}

const grid = document.getElementById('grid');

for (let d = 1; d <= 27; d++) {

  // ── Cajita especial del día 25 ──
  if (d === 25) {
    const meta = document.createElement('a');
    meta.className = 'box meta';
    meta.href = 'dia-25.html';
    meta.target = '_blank';
    meta.rel = 'noopener';
    meta.innerHTML = `
      <div class="meta-badge">especial ✿</div>
      <div class="box-day">25</div>
      <div class="box-emoji">❤️</div>
      <div class="box-label">nos vemos</div>
    `;
    grid.appendChild(meta);
    continue;
  }

  // ── Cajita especial del día 26 (amor y amistad) ──
  // Se rige por su propia fecha/hora, no por la fórmula de START_DAY.
  if (d === 26) {
    const unlocked26 = TEST_MODE ? true : (Date.now() >= DIA26_APERTURA);

    const a26 = document.createElement('a');
    a26.className = 'box dia26' + (unlocked26 ? ' open' : ' locked');

    if (unlocked26) {
      a26.href = 'dia26.html'; // ← nombre del archivo del día 26
    } else {
      a26.href = '#';
      a26.addEventListener('click', e => {
        e.preventDefault();
        const m = DIA26_MENSAJES[Math.floor(Math.random() * DIA26_MENSAJES.length)];
        document.getElementById('modal-title').textContent = m.title;
        document.getElementById('modal-msg').textContent   = m.msg;
        document.getElementById('modal-date').textContent  = 'se abre el 19 de septiembre, 12:00 m.';
        document.getElementById('modal').classList.add('show');
      });
    }

    a26.innerHTML = `
      <div class="box-day">26</div>
      ${unlocked26
        ? `<div class="box-emoji">✿</div><div class="box-label">día 26</div>`
        : `<div class="lock-icon">🔒</div>`
      }
    `;

    grid.appendChild(a26);
    continue;
  }

  // ── Cajita especial del día 27 (flores amarillas) ──
  if (d === 27) {
    const unlocked27 = TEST_MODE ? true : (Date.now() >= DIA27_APERTURA);

    const a27 = document.createElement('a');
    a27.className = 'box dia27' + (unlocked27 ? ' open' : ' locked');

    if (unlocked27) {
      a27.href = 'dia27.html'; // ← nombre del archivo del día 27
    } else {
      a27.href = '#';
      a27.addEventListener('click', e => {
        e.preventDefault();
        const m = DIA27_MENSAJES[Math.floor(Math.random() * DIA27_MENSAJES.length)];
        document.getElementById('modal-title').textContent = m.title;
        document.getElementById('modal-msg').textContent   = m.msg;
        document.getElementById('modal-date').textContent  = 'se abre el 21 de septiembre';
        document.getElementById('modal').classList.add('show');
      });
    }

    a27.innerHTML = `
      <div class="box-day">27</div>
      ${unlocked27
        ? `<div class="box-emoji">✿</div><div class="box-label">día 27</div>`
        : `<div class="lock-icon">🔒</div>`
      }
    `;

    grid.appendChild(a27);
    continue;
  }

  const unlocked = isUnlocked(d);
  const todayBox = isToday(d);
  const emoji    = EMOJIS[d - 1] || '🌿';

  const a = document.createElement('a');
  a.className = 'box' + (unlocked ? (todayBox ? ' today open' : ' open') : ' locked');

  if (unlocked) {
    a.href = `dia-${d}.html`;
  } else {
    a.href = '#';
    a.addEventListener('click', e => { e.preventDefault(); openModal(d); });
  }

  a.innerHTML = `
    ${todayBox ? '<div class="today-badge">hoy ✿</div>' : ''}
    <div class="box-day">${d}</div>
    ${unlocked
      ? `<div class="box-emoji">${emoji}</div><div class="box-label">día ${d}</div>`
      : `<div class="lock-icon">🔒</div>`
    }
  `;

  grid.appendChild(a);
}

const PARTICLES = ['🌿','🍃','🌸','🌺','✿','🌱','🍀','🌼'];

function spawnParticles(x, y, count = 8) {
  for (let i = 0; i < count; i++) {
    const el    = document.createElement('span');
    el.className = 'particle';

    const angle = (360 / count) * i + Math.random() * 20;
    const dist  = 60 + Math.random() * 80;
    const tx    = Math.cos(angle * Math.PI / 180) * dist;
    const ty    = Math.sin(angle * Math.PI / 180) * dist - 60;
    const dur   = 0.9 + Math.random() * 0.6;
    const fs    = 0.9 + Math.random() * 0.8;
    const rot   = -180 + Math.random() * 360;

    el.textContent  = PARTICLES[Math.floor(Math.random() * PARTICLES.length)];
    el.style.cssText = `
      left: ${x}px; top: ${y}px;
      --tx: ${tx}px; --ty: ${ty}px;
      --dur: ${dur}s; --fs: ${fs}rem; --rot: ${rot}deg;
    `;

    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

document.addEventListener('click', e => {
  spawnParticles(e.clientX, e.clientY, 8);
});

function openModal(day) {
  const msg = LOCKED_MESSAGES[day - 1];
  document.getElementById('modal-title').textContent = msg.title;
  document.getElementById('modal-msg').textContent   = msg.msg;
  document.getElementById('modal-date').textContent  = 'se abre el ' + boxDateLabel(day);
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

</script>
